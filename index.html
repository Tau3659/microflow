<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#041820" />
  <title>菌流 · MICROFLOW</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="is-landscape">
  <div id="app">
    <canvas id="game" aria-label="MICROFLOW"></canvas>

    <section id="title-screen" class="screen">
      <div class="title-atmosphere" aria-hidden="true"></div>
      <div class="title-content">
        <p class="brand">MICROFLOW</p>
        <h1 class="brand-cn">菌流</h1>
        <button id="btn-start" class="cta icon-cta" type="button" aria-label="开始">
          <span class="icon-play" aria-hidden="true"></span>
        </button>
        <div class="title-signs" aria-hidden="true">
          <span class="sign warn"></span>
          <span class="sign calm"></span>
          <span class="sign dna"></span>
        </div>
      </div>
    </section>

    <section id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-left">
        <div id="hud-depth" class="depth-pips" aria-label="层级"></div>
        <div id="hud-form-pips" class="form-pips" aria-label="形态"></div>
        <div class="meter protein-meter" title="本层蛋白">
          <span class="meter-icon protein-icon" aria-hidden="true"></span>
          <div class="meter-track">
            <div id="hud-protein-fill" class="meter-fill protein-fill"></div>
          </div>
        </div>
      </div>

      <div class="hud-center">
        <button id="btn-exit" class="exit-btn" type="button" aria-label="退出">
          <span class="icon-close" aria-hidden="true"></span>
        </button>
      </div>

      <div class="hud-right">
        <div id="hud-nuclei" class="nuclei-row" aria-label="细胞核"></div>
        <div class="meter evolve-meter" title="进度">
          <span id="hud-progress-icon" class="meter-icon evolve-icon" aria-hidden="true"></span>
          <div class="meter-track">
            <div id="hud-progress-fill" class="meter-fill evolve-fill"></div>
          </div>
        </div>
        <div id="hud-status" class="status-dot" aria-hidden="true"></div>
      </div>
    </section>

    <div id="controls" class="controls hidden">
      <div id="virtual-pad" class="virtual-pad" aria-label="移动">
        <div class="pad-cross" aria-hidden="true"></div>
        <div id="virtual-knob" class="virtual-knob"></div>
      </div>
      <button id="btn-boost" class="boost-btn" type="button" aria-label="加速">
        <span class="boost-chevron" aria-hidden="true"></span>
      </button>
    </div>

    <section id="overlay" class="screen overlay hidden">
      <div class="overlay-card">
        <p class="brand overlay-brand-mark">MICROFLOW</p>
        <div id="overlay-visual" class="overlay-visual end" aria-hidden="true"></div>
        <div class="overlay-actions">
          <button id="btn-retry" class="cta icon-cta" type="button" aria-label="重试">
            <span class="icon-retry" aria-hidden="true"></span>
          </button>
          <button id="btn-home" class="cta icon-cta ghost" type="button" aria-label="返回">
            <span class="icon-home" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
