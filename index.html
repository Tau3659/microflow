<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="theme-color" content="#041820" />
  <title>菌流 · MICROFLOW</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="rotate-hint" class="rotate-hint" hidden>
    <div class="rotate-card">
      <p class="rotate-brand">MICROFLOW</p>
      <p class="rotate-title">请横屏游玩</p>
      <p class="rotate-text">旋转手机至横向，沉浸微观之海</p>
      <div class="rotate-icon" aria-hidden="true"></div>
    </div>
  </div>

  <div id="app">
    <canvas id="game" aria-label="菌流游戏画布"></canvas>

    <section id="title-screen" class="screen">
      <div class="title-atmosphere" aria-hidden="true"></div>
      <div class="title-content landscape-title">
        <p class="brand">MICROFLOW</p>
        <h1 class="brand-cn">菌流</h1>
        <p class="tagline">从原核细胞启程，吞噬细胞核，进化上行</p>
        <button id="btn-start" class="cta" type="button">开始演化</button>
        <p class="hint">横屏 · 红黄警示为攻击性 · 部分生物被打后会激怒</p>
      </div>
    </section>

    <section id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-left">
        <span class="hud-brand">菌流</span>
        <span id="hud-layer">原核海域</span>
        <span id="hud-form">原核细胞</span>
        <span id="hud-protein-left">本层蛋白 42</span>
      </div>
      <div class="hud-center">
        <button id="btn-exit" class="exit-btn" type="button">退出游戏</button>
      </div>
      <div class="hud-right">
        <span id="hud-nuclei">细胞核 1 / 1</span>
        <span id="hud-points">蛋白质 0 / 12</span>
        <span id="hud-evolve" class="hud-evolve">收集蛋白质</span>
      </div>
    </section>

    <div id="controls" class="controls hidden">
      <div id="virtual-pad" class="virtual-pad" aria-label="方向键">
        <div class="pad-cross" aria-hidden="true"></div>
        <div id="virtual-knob" class="virtual-knob"></div>
        <span class="control-label">方向</span>
      </div>
      <button id="btn-boost" class="boost-btn" type="button" aria-label="加速">
        <span class="boost-icon">加速</span>
      </button>
    </div>

    <section id="overlay" class="screen overlay hidden">
      <div class="overlay-card">
        <p class="overlay-brand">菌流</p>
        <h2 id="overlay-title">细胞核被吞噬</h2>
        <p id="overlay-text">你的细胞核被吞食，生命终止。</p>
        <div class="overlay-actions">
          <button id="btn-retry" class="cta" type="button">重新开始</button>
          <button id="btn-home" class="cta ghost" type="button">返回标题</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
