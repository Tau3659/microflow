<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#041820" />
  <title>菌流 · MICROFLOW</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="is-landscape">
  <div id="app">
    <canvas id="game" aria-label="MICROFLOW"></canvas>

    <section id="title-screen" class="screen">
      <div class="title-atmosphere" aria-hidden="true"></div>
      <div class="title-content">
        <p class="brand">MICROFLOW</p>
        <h1 class="brand-cn">菌流</h1>
        <button id="btn-start" class="cta icon-cta" type="button" aria-label="开始">
          <span class="icon-play" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <section id="hud" class="hud hidden" aria-live="polite">
      <button id="btn-exit" class="exit-btn" type="button" aria-label="退出">
        <span class="icon-close" aria-hidden="true"></span>
      </button>
    </section>

    <div id="controls" class="controls hidden">
      <div id="virtual-pad" class="virtual-pad" aria-label="移动">
        <div class="pad-cross" aria-hidden="true"></div>
        <div id="virtual-knob" class="virtual-knob"></div>
      </div>
      <button id="btn-boost" class="boost-btn" type="button" aria-label="加速">
        <svg class="boost-ring" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="boost-ring-track" cx="36" cy="36" r="32" />
          <circle id="boost-ring-fill" class="boost-ring-fill" cx="36" cy="36" r="32" />
        </svg>
        <span class="boost-chevron" aria-hidden="true"></span>
      </button>
    </div>

    <section id="overlay" class="screen overlay hidden">
      <div class="overlay-card">
        <div id="overlay-visual" class="overlay-visual end" aria-hidden="true"></div>
        <div class="overlay-actions">
          <button id="btn-retry" class="cta icon-cta" type="button" aria-label="重试">
            <span class="icon-retry" aria-hidden="true"></span>
          </button>
          <button id="btn-home" class="cta icon-cta ghost" type="button" aria-label="返回">
            <span class="icon-home" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
